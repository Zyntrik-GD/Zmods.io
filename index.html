<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .card {
            background-color: #1e293b;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <h1>¡Hola, mundo!</h1>
    <p>Esta es mi primera página web independiente y gratuita.</p>
    
    <div class="card">
        <h2>Mis Proyectos</h2>
        <p>Próximamente estaré publicando mis avances y descargas aquí.</p>
    </div>
</body>
</html>
