<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmods - Minecraft</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #161b22;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            max-width: 600px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        nav a:hover, nav a.active {
            background-color: #30363d;
        }
        header { max-width: 800px; margin: 0 auto 30px auto; }
        h1 { color: #58a6ff; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 1.1rem; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #161b22;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tag {
            display: inline-block;
            background-color: #238636;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .card h2 { color: #f0f6fc; font-size: 1.4rem; margin-bottom: 10px; }
        .card p { color: #8b949e; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        .btn-download {
            display: inline-block;
            background-color: #238636;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-download:hover { background-color: #2ea043; }
        footer { margin-top: 60px; color: #484f58; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Menú Superior -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="minecraft.html" class="active">Minecraft</a>
        <a href="geometrydash.html">Geometry Dash</a>
    </nav>

    <header>
        <h1>Mods de Minecraft</h1>
        <p>Explora y descarga modificaciones optimizadas para tus mundos.</p>
    </header>

    <main class="container">
        <!-- Mod 1 de Minecraft -->
        <div class="card">
            <div>
                <span class="tag">Fabric 1.21</span>
                <h2>Tu Mod de Minecraft 1</h2>
                <p>Descripción detallada de tu mod de Minecraft, características y compatibilidad con shaders.</p>
            </div>
            <a href="#" class="btn-download">Descargar .jar</a>
        </div>
    </main>

    <footer>
        <p>© Zmods</p>
    </footer>

</body>
</html>
